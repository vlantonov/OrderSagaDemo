version: "3.9"

# R-8: Kafka topics are created at container start via KAFKA_CREATE_TOPICS env var
# on the cp-kafka image (KRaft mode, no Zookeeper).

x-common-env: &common-env
  KAFKA_BROKERS: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317

services:
  # ─── Kafka (KRaft mode, no Zookeeper) ─────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"   # R-8: topics auto-created on first produce
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── OTel Collector ──────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "8888:8888"   # collector self-metrics
      - "8889:8889"   # prometheus scrape endpoint
    volumes:
      - ../../observability/otelcollector/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1h"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Loki ────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki/loki-config.yaml:/etc/loki/config.yaml:ro
    command: ["-config.file=/etc/loki/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── Tempo ───────────────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    ports:
      - "3200:3200"
    volumes:
      - ../../observability/tempo/tempo-config.yaml:/etc/tempo/config.yaml:ro
    command: ["-config.file=/etc/tempo/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.4
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Order Service ───────────────────────────────────────────────────────
  order-service:
    build:
      context: ../..
      dockerfile: services/order/Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      HTTP_ADDR: ":8080"
      INVENTORY_GRPC_ADDR: inventory-service:9090
      KAFKA_CONSUMER_GROUP: order-service
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Payment Service ─────────────────────────────────────────────────────
  payment-service:
    build:
      context: ../..
      dockerfile: services/payment/Dockerfile
    container_name: payment-service
    environment:
      <<: *common-env
      KAFKA_CONSUMER_GROUP: payment-service
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep payment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Inventory Service ───────────────────────────────────────────────────
  inventory-service:
    build:
      context: ../..
      dockerfile: services/inventory/Dockerfile
    container_name: inventory-service
    environment:
      <<: *common-env
      GRPC_ADDR: ":9090"
      # R-6: any item_id starting with FAIL_ triggers the compensation path
      INVENTORY_FAIL_ITEM_PREFIX: "FAIL_"
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep inventory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
