name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Build, vet, and race-test the Go module
  # ──────────────────────────────────────────────────────────
  build-test:
    name: Build · Vet · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache: true            # caches $GOPATH/pkg/mod keyed on go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test (race detector)
        run: go test -race -count=1 ./...

  # ──────────────────────────────────────────────────────────
  # 2. Static analysis — golangci-lint (v2.13.2)
  # ──────────────────────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2        # matches tech-stack.md v2.13.2 pin (ADR-001)

  # ──────────────────────────────────────────────────────────
  # 3. Vulnerability scan — govulncheck
  #
  # ADR-003 (amended) cleared all called vulns: the Go 1.25 bump plus the
  # grpc/otel/x-net upgrades, then the OTel v1.44.0 bump closing the last
  # advisory GO-2026-5158.  govulncheck ./... now reports zero called
  # vulnerabilities, so the gate is blocking (continue-on-error dropped).
  # ──────────────────────────────────────────────────────────
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache: true

      - name: Install govulncheck
        # Restored to @latest under the Go 1.25 toolchain (ADR-003 supersedes
        # ADR-002): with Go >= 1.25 the current x/vuln line installs cleanly.
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  # ──────────────────────────────────────────────────────────
  # 4. Proto lint — buf (v1.35.x)
  # ──────────────────────────────────────────────────────────
  proto-lint:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.35.0"      # matches tech-stack.md v1.35.x pin

      - name: buf lint
        run: buf lint
        working-directory: proto
