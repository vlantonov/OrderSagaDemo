# golangci-lint configuration
# Schema v2 (migrated from v1.60.x — see docs/tech-stack.md §2 / ADR-001).
# Linters enabled (six, unchanged): errcheck, govet, staticcheck, revive, gosec,
# and goimports (moved to the v2 `formatters` section).
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - revive
    - staticcheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vladiant/ordersagademo
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
