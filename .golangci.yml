# golangci-lint configuration
# Linters listed in docs/tech-stack.md (v1.60.x)

run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - goimports
    - revive
    - gosec

linters-settings:
  goimports:
    local-prefixes: github.com/vladiant/ordersagademo
