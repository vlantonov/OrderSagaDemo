syntax = "proto3";

package inventory.v1;

option go_package = "github.com/vladiant/ordersagademo/internal/gen/inventory/v1;inventoryv1";

service InventoryService {
  rpc ReserveInventory(ReserveInventoryRequest) returns (ReserveInventoryResponse);
  rpc ReleaseInventory(ReleaseInventoryRequest) returns (ReleaseInventoryResponse);
}

message ItemQuantity {
  string item_id = 1;
  int32  quantity = 2;
}

message ReserveInventoryRequest {
  string            order_id = 1;
  repeated ItemQuantity items = 2;
}

message ReserveInventoryResponse {
  bool   success        = 1;
  string reservation_id = 2; // set on success; empty on failure
  string error_reason   = 3; // set on failure; empty on success
}

message ReleaseInventoryRequest {
  string order_id       = 1;
  string reservation_id = 2;
}

message ReleaseInventoryResponse {
  bool   success      = 1;
  string error_reason = 2;
}
